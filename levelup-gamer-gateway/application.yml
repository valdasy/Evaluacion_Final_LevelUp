server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuración CORS Global (Permite que React se conecte)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      
      # Las Rutas
      routes:
        - id: backend-route
          uri: http://backend:8081  # Nombre del servicio en Docker
          predicates:
            - Path=/api/**