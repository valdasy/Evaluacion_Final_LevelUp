name: Pipeline CI/CD LevelUp Gamer 🚀

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # TRABAJO 1: Verificar el Backend (Java/Spring Boot)
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./levelup-gamer-backend  # 👈 Entra a la subcarpeta

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Compilar con Maven (IE9)
      run: mvn clean package -DskipTests  # Saltamos tests para que sea rápido

  # TRABAJO 2: Verificar el Frontend (React)
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./levelup-gamer-frontend  # 👈 Entra a la subcarpeta

    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './levelup-gamer-frontend/package-lock.json'

    - name: Instalar Dependencias
      run: npm install

    - name: Construir Proyecto (Build)
      run: npm run build