version: '3.8'

services:
  # 1. FRONTEND
  frontend:
    build:
      context: ./levelup-gamer-frontend
      dockerfile: Dockerfile
    image: mi-frontend-gamer:v1
    ports:
      - "3000:80"
    depends_on:
      - gateway
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # 5. API GATEWAY
  gateway:
    build:
      context: ./levelup-gamer-gateway
      dockerfile: Dockerfile
    image: levelup-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # 2. BACKEND
  backend:
    build:
      context: ./levelup-gamer-backend
      dockerfile: Dockerfile
    image: levelup-backend:latest
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/levelup_gamer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - database
      - rabbitmq
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # 3. BASE DE DATOS
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: levelup_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      replicas: 1

  # 4. MENSAJERÍA
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      replicas: 1

volumes:
  db_data: